@if (api.isAuthenticated()) {
  <!-- Glass Navbar -->
  <nav class="navbar-glass">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-8">
          <a routerLink="/dashboard" class="text-lg font-bold tracking-tight" style="font-family: var(--font-heading); color: var(--color-brand-500);">
            SupportHub
          </a>
          <div class="flex items-center gap-1">
            <a routerLink="/dashboard" routerLinkActive="text-brand-600 bg-brand-50 dark:bg-brand-950/40 font-semibold"
              class="px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800/50 transition-all duration-200">
              Dashboard
            </a>
            <a routerLink="/tickets" routerLinkActive="text-brand-600 bg-brand-50 dark:bg-brand-950/40 font-semibold"
              class="px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800/50 transition-all duration-200">
              Tickets
            </a>
          </div>
        </div>
        <button (click)="api.logout()"
          class="px-3 py-1.5 text-sm text-surface-500 hover:text-danger rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800/50 transition-all duration-200">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 animate-fade-in-up">
    <router-outlet />
  </main>
} @else {
  <router-outlet />
}
